  </defs>
  <!-- Base Plate / Recessed Tray Slot -->
  <rect x="6" y="10" width="52" height="44" rx="14" fill="#E8D2A7" stroke="#2B2118" stroke-width="3" />
  <!-- Recessed Inner Bezel -->
