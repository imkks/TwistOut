  <circle cx="28" cy="32" r="14" fill="url(#slotHole)" stroke="#1A130C" stroke-width="1.5" />
  <!-- Gloss highlight inside hole -->
  <ellipse cx="28" cy="24" rx="9" ry="3.5" fill="#FFFFFF" opacity="0.15" />
  <!-- +1 Badge -->
  <circle cx="46" cy="22" r="13" fill="url(#plusBadge)" stroke="#2B2118" stroke-width="2.5" />
  <path d="M46 15v14M39 22h14" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
