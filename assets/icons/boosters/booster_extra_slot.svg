<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="slotHole" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#140E08" />
      <stop offset="100%" stop-color="#2B2118" />
    </radialGradient>
    <linearGradient id="metalRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDF2D0" />
      <stop offset="100%" stop-color="#CBB38B" />
    </linearGradient>
    <linearGradient id="plusBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#30A46C" />
      <stop offset="100%" stop-color="#178F5F" />
